[package]
name = "savesync-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Local-first, safety-critical save data engine for SaveSync"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "serde_json", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
steam-vdf-parser = "0.1.2"
tar = "0.4.46"
thiserror = "2.0.21"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
