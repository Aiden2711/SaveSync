<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SaveSync — Mockup</title>
<link rel="icon" href="data:,">
<script>
  (function () {
    var theme = "dark";
    try {
      var saved = localStorage.getItem("savesync-mockup-theme");
      if (saved === "dark" || saved === "light") theme = saved;
      else if (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
    } catch (e) {}
    document.documentElement.dataset.theme = theme;
  })();
</script>
<style>
/*
 * SaveSync design system — "Console System UI, cool".
 *
 * One world, two states: a cool white system surface (Wii / Wii U system menu)
 * and a graphite night surface. Both themes declare the same token names, so no
 * component rule needs a theme branch. See DESIGN.md for the verified contrast
 * pairs behind these values; every ratio quoted there is measured, not estimated.
 */

@font-face {
  font-family: "Fredoka";
  font-style: normal;
  font-weight: 300 700;
  font-display: swap;
  src: url("../src/assets/fonts/fredoka-latin-var.woff2") format("woff2");
}

:root {
  /* Resolved per theme below; the block here is the dark default so a shell
     that renders before `data-theme` is applied never flashes warm or blank. */
  --base: #0b0f15;
  --base-2: #0a0d12;
  --surface: #151b24;
  --surface-2: #1e2733;
  --line: #2b3746;
  --line-strong: #62778f;
  --ink: #e8eff8;
  --ink-2: #aab9ca;
  --ink-3: #8b99ab;
  --accent: #5cbaff;
  --accent-hover: #82cbff;
  --accent-ink: #04121d;
  --accent-text: #5cbaff;
  --focus-ring: #5cbaff;
  --danger: #ff6b5e;
  --danger-text: #ff9b93;
  --danger-ink: #150604;
  --warn: #f2c36b;
  --warn-ink: #f2c36b;
  --scrim: rgba(4, 7, 11, 0.66);

  --font-display: "Fredoka", "Segoe UI Variable Display", "Segoe UI", system-ui,
    sans-serif;
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system,
    "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "Consolas", "SF Mono", monospace;

  /* Fixed scale, ratio ~1.15. Nothing renders below 14px. */
  --text-2xs: 14px;
  --text-xs: 14px;
  --text-sm: 15px;
  --text-base: 15.5px;
  --text-md: 18px;
  --text-lg: 22px;
  --text-xl: 28px;
  --text-2xl: 34px;

  --space-3xs: 4px;
  --space-2xs: 8px;
  --space-xs: 12px;
  --space-sm: 16px;
  --space-md: 24px;
  --space-lg: 32px;
  --space-xl: 48px;

  --radius-control: 8px;
  --radius-panel: 12px;
  --radius-dialog: 16px;

  --shadow-near: 0 1px 2px rgba(0, 0, 0, 0.55);
  --shadow-far: 0 12px 30px rgba(0, 0, 0, 0.45);

  --dur-fast: 140ms;
  --dur: 200ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);

  color-scheme: dark;
  --warn-ink: #f2c36b;
}

[data-theme="dark"] {
  color-scheme: dark;
  --base: #0b0f15;
  --base-2: #0a0d12;
  --surface: #151b24;
  --surface-2: #1e2733;
  --line: #2b3746;
  --line-strong: #62778f;
  --ink: #e8eff8;
  --ink-2: #aab9ca;
  --ink-3: #8b99ab;
  --accent: #5cbaff;
  --accent-hover: #82cbff;
  --accent-ink: #04121d;
  --accent-text: #5cbaff;
  --focus-ring: #5cbaff;
  --danger: #ff6b5e;
  --danger-text: #ff9b93;
  --danger-ink: #150604;
  --warn: #f2c36b;
  --warn-ink: #f2c36b;
  --scrim: rgba(4, 7, 11, 0.66);
  --shadow-near: 0 1px 2px rgba(0, 0, 0, 0.55);
  --shadow-far: 0 12px 30px rgba(0, 0, 0, 0.45);
}

[data-theme="light"] {
  color-scheme: light;
  --base: #eef3f9;
  --base-2: #e6edf6;
  --surface: #ffffff;
  --surface-2: #e4ebf4;
  --line: #ccd8e6;
  --line-strong: #6d8098;
  --ink: #101720;
  --ink-2: #465468;
  --ink-3: #5f6d80;
  --accent: #0a6db0;
  --accent-hover: #095f99;
  --accent-ink: #ffffff;
  --accent-text: #0a6db0;
  --focus-ring: #0a6db0;
  --danger: #b3261e;
  --danger-text: #b3261e;
  --danger-ink: #ffffff;
  --warn: #8a5207;
  --warn-ink: #8a5207;
  --scrim: rgba(20, 30, 44, 0.28);
  --shadow-near: 0 1px 2px rgba(16, 23, 32, 0.06);
  --shadow-far: 0 10px 26px rgba(16, 23, 32, 0.1);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body,
#root {
  height: 100%;
}

body {
  margin: 0;
  background: var(--base);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  /* Native, theme-aware scrollbars: themed, not reinvented. */
  scrollbar-color: var(--line-strong) transparent;
}

::selection {
  background: var(--accent);
  color: var(--accent-ink);
}

h1,
h2,
h3 {
  margin: 0;
  font-weight: 600;
}

p {
  margin: 0;
}

ul,
ol {
  margin: 0;
}

button,
input,
select {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}

/*
 * Shell: system bar above one scroll region. No sidebar, no status bar;
 * long-running state stays in the inline .busy-line and banners.
 */
.app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  min-height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  gap: var(--space-sm);
  flex-wrap: wrap;
  min-width: 0;
  padding: var(--space-2xs) var(--space-md);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  min-width: 0;
}

/* Wordmark only: no badge, no monogram tile, no tagline. */
.brand-name {
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.015em;
  color: var(--ink);
}

.nav {
  display: flex;
  align-items: center;
  gap: var(--space-3xs);
  flex-wrap: wrap;
  min-width: 0;
  margin-left: var(--space-2xs);
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2xs);
  min-height: 34px;
  padding: 0 var(--space-xs);
  border: 1px solid transparent;
  border-radius: var(--radius-control);
  background: transparent;
  color: var(--ink-2);
  font-family: var(--font-ui);
  font-size: var(--text-sm);
  font-weight: 550;
  line-height: 1;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease),
    color var(--dur-fast) var(--ease);
}

.nav-btn:hover:not(:disabled) {
  border-color: transparent;
  background: var(--surface-2);
  color: var(--ink);
}

.nav-btn[aria-current="page"] {
  border-color: transparent;
  background: var(--surface-2);
  color: var(--ink);
}

.nav-icon {
  display: grid;
  place-items: center;
  flex: none;
  width: 18px;
  height: 18px;
  color: currentColor;
}

.nav-icon svg {
  display: block;
  width: 18px;
  height: 18px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: var(--space-2xs);
  margin-left: auto;
}

.view {
  display: block;
  min-width: 0;
}

.view-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--space-md);
  flex-wrap: wrap;
  padding-bottom: var(--space-md);
  border-bottom: 1px solid var(--line);
  margin-bottom: var(--space-md);
}

.view-header h2 {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.02em;
}

.view-header .sub {
  margin-top: var(--space-2xs);
  max-width: 68ch;
  color: var(--ink-2);
  font-size: var(--text-sm);
}

.view-header .primary {
  min-height: 40px;
  padding: 0 var(--space-sm);
}

.panel {
  display: grid;
  gap: var(--space-xs);
  padding: var(--space-sm) var(--space-md) var(--space-md);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
}

.panel > h2,
.panel-title h2 {
  font-family: var(--font-display);
  font-size: var(--text-md);
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--ink);
}

.panel-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-xs);
}

.stack {
  display: grid;
  gap: var(--space-xs);
}

/* A form's submit is an action, not a full-width field. */
.stack > button {
  justify-self: start;
}

.row {
  display: flex;
  align-items: center;
  gap: var(--space-2xs);
  flex-wrap: wrap;
}

.space-between {
  justify-content: space-between;
  align-items: flex-start;
}

.content {
  padding: var(--space-lg) var(--space-lg) var(--space-xl);
  overflow-y: auto;
}

/* ---- Controls ------------------------------------------------------- */

button {
  cursor: pointer;
  min-height: 34px;
  padding: 0 var(--space-xs);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  background: var(--surface);
  font-family: var(--font-ui);
  font-size: var(--text-sm);
  font-weight: 550;
  text-align: center;
  transition: background var(--dur-fast) var(--ease),
    border-color var(--dur-fast) var(--ease),
    transform var(--dur-fast) var(--ease);
}

button:hover:not(:disabled) {
  background: var(--surface-2);
}

button:active:not(:disabled) {
  transform: scale(0.985);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

/* A disabled primary keeps its shape but drops the accent fill: a washed-out
   accent reads as a broken control, a neutral one reads as unavailable. */
button.primary:disabled {
  opacity: 1;
  background: var(--surface-2);
  border-color: var(--line-strong);
  color: var(--ink-2);
}

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

button.primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

button.ghost {
  border-color: transparent;
  background: transparent;
}

button.ghost:hover:not(:disabled) {
  background: var(--surface-2);
}

button.danger {
  color: var(--danger-text);
  border-color: var(--danger);
}

button.danger:hover:not(:disabled) {
  background: var(--danger);
  color: var(--danger-ink);
  border-color: var(--danger);
}

button.ghost.danger {
  border-color: transparent;
  color: var(--danger-text);
}

button.ghost.danger:hover:not(:disabled) {
  border-color: var(--danger);
  background: var(--danger);
  color: var(--danger-ink);
}

button.small {
  min-height: 28px;
  font-size: var(--text-xs);
}

button.tiny {
  min-height: 26px;
  padding: 0 var(--space-2xs);
  font-size: var(--text-2xs);
}

button.ghost.tiny {
  border-color: transparent;
  padding: 0 var(--space-3xs);
}

input,
select {
  width: 100%;
  min-height: 38px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  padding: var(--space-2xs) var(--space-xs);
  font-family: var(--font-ui);
  font-size: var(--text-sm);
}

input::placeholder {
  color: var(--ink-2);
  opacity: 0.85;
}

input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 1px;
  border-color: var(--focus-ring);
}

label {
  display: grid;
  gap: var(--space-2xs);
  font-size: var(--text-xs);
  font-weight: 550;
  color: var(--ink-2);
}

/* ---- Messages ------------------------------------------------------- */

.messages {
  display: grid;
  gap: var(--space-2xs);
  margin-bottom: var(--space-md);
}

.messages:empty {
  display: none;
  margin: 0;
}

.banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  padding: var(--space-2xs) var(--space-xs);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-control);
  font-size: var(--text-sm);
}

.banner.error {
  border-color: var(--danger);
  color: var(--danger-text);
}

.banner.warning {
  border-color: var(--warn);
  color: var(--warn-ink);
}

.busy-line {
  display: flex;
  align-items: center;
  gap: var(--space-2xs);
  color: var(--accent-text);
  font-size: var(--text-2xs);
  font-weight: 550;
}

.busy-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: busy-pulse 1.1s var(--ease) infinite;
}

@keyframes busy-pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}

@media (prefers-reduced-motion: reduce) {
  .busy-dot {
    animation: none;
  }
}

/* ---- Library grid --------------------------------------------------- */

/*
 * Cover wall. Every game gets one equal channel: a 2:3 cover with its label
 * directly beneath it. The grid top-aligns its cells, so a tile's height is
 * exactly its art plus its label and no cell can stretch a label away from the
 * art above it.
 */
.tile-grid {
  list-style: none;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  align-items: start;
  gap: var(--space-md) var(--space-sm);
}

.tile-cell {
  display: flex;
  min-width: 0;
}

.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  width: 100%;
  min-width: 0;
  overflow: hidden;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  background: var(--surface);
  color: var(--ink);
  font-weight: 400;
  text-align: left;
  box-shadow: var(--shadow-near);
  transition: border-color var(--dur-fast) var(--ease),
    box-shadow var(--dur) var(--ease),
    transform var(--dur) var(--ease);
}

.tile:hover:not(:disabled),
.tile:focus-visible {
  border-color: var(--line-strong);
  box-shadow: var(--shadow-far);
  transform: translateY(-2px);
}

/*
 * Selected tile: a stronger outline plus the check badge. The accent is a state
 * colour for the badge only — never the tile's border.
 */
.tile[aria-current="true"] {
  border-color: var(--line-strong);
  background: var(--surface);
  outline: 2px solid var(--focus-ring);
  outline-offset: -2px;
}

.tile[aria-current="true"] .tile-check {
  border-color: var(--line-strong);
  color: var(--ink);
  opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
  .tile,
  .tile:hover:not(:disabled),
  .tile:focus-visible {
    transform: none;
  }

  .tile-art .cover-art svg,
  .tile-art .cover-art img {
    transform: none;
  }
}

.tile-art {
  position: relative;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  width: 100%;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  background: var(--surface-2);
}

/* Art always fills its box, so no cover is ever letterboxed. */
.tile-art .cover-art {
  position: absolute;
  inset: 0;
  height: 100%;
  aspect-ratio: auto;
  border-radius: 0;
}

.tile-art .cover-art svg,
.tile-art .cover-art img {
  display: block;
  width: 100%;
  height: 100%;
  transition: transform var(--dur) var(--ease);
}

.tile:hover .tile-art .cover-art svg,
.tile:focus-visible .tile-art .cover-art svg,
.tile:hover .tile-art .cover-art img,
.tile:focus-visible .tile-art .cover-art img {
  transform: scale(1.02);
}

.tile-label {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-3xs);
  min-width: 0;
  padding: var(--space-2xs) var(--space-xs) var(--space-xs);
}

.tile-head {
  display: flex;
  align-items: center;
  gap: var(--space-2xs);
  min-width: 0;
}

.tile-title {
  display: -webkit-box;
  overflow: hidden;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  color: var(--ink);
  font-family: var(--font-display);
  font-size: var(--text-md);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
  /* Fredoka's word space is tight at UI sizes; keep two-word titles legible. */
  word-spacing: 0.06em;
}

.tile-acc {
  max-width: 100%;
  overflow: hidden;
  color: var(--ink-2);
  font-size: var(--text-2xs);
  font-weight: 500;
  line-height: 1.4;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tile-check {
  position: absolute;
  top: var(--space-2xs);
  right: var(--space-2xs);
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  background: var(--surface);
  color: var(--ink);
  opacity: 0;
  transition: opacity var(--dur-fast) var(--ease);
}

.tile-check svg {
  display: block;
  width: 14px;
  height: 14px;
}

.cover-art {
  display: block;
  width: 100%;
  aspect-ratio: 2 / 3;
  overflow: hidden;
  border-radius: var(--radius-panel);
  background: var(--surface-2);
}

.cover-art svg {
  display: block;
  width: 100%;
  height: 100%;
}

.cover-art img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.dirty-badge {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  margin-left: var(--space-3xs);
}

/* ---- Empty states --------------------------------------------------- */

.empty {
  display: grid;
  gap: var(--space-2xs);
  max-width: 560px;
  padding: var(--space-xl) var(--space-lg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
}

.empty h3 {
  font-family: var(--font-display);
  font-size: var(--text-md);
  letter-spacing: -0.01em;
}

.empty p {
  max-width: 52ch;
  color: var(--ink-2);
}

/* ---- Detail --------------------------------------------------------- */

.back {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2xs);
  min-height: 30px;
  margin-bottom: var(--space-sm);
  padding: 0 var(--space-3xs);
  border-color: transparent;
  background: transparent;
  color: var(--ink-2);
  font-size: var(--text-sm);
}

.back:hover:not(:disabled) {
  border-color: transparent;
  background: transparent;
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.detail-header {
  display: grid;
  grid-template-columns: 168px minmax(0, 1fr) auto;
  gap: var(--space-md);
  align-items: start;
  padding-bottom: var(--space-md);
  border-bottom: 1px solid var(--line);
  margin-bottom: var(--space-md);
}

.detail-cover {
  width: 168px;
}

.detail-cover .cover-art {
  width: 168px;
  box-shadow: var(--shadow-far);
}

.detail-copy h2 {
  margin: var(--space-3xs) 0 var(--space-2xs);
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}

.detail-meta {
  color: var(--ink-2);
  font-size: var(--text-sm);
  line-height: 1.45;
}

.detail-actions {
  display: flex;
  gap: var(--space-2xs);
}

.detail-body {
  display: grid;
  gap: var(--space-sm);
}

.panel.conflicts {
  border-color: var(--warn);
}

.conflicts > .muted {
  max-width: 80ch;
}

.conflict {
  display: grid;
  gap: var(--space-2xs);
  padding-top: var(--space-xs);
  border-top: 1px solid var(--line);
}

.conflict-options {
  list-style: none;
  padding: 0;
  display: grid;
  gap: var(--space-2xs);
}

.conflict-options li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-xs);
  padding: var(--space-2xs) var(--space-xs);
  background: var(--base);
  border: 1px solid var(--line);
  border-radius: var(--radius-control);
}

.conflict-options strong {
  font-weight: 600;
}

.snapshot-form {
  display: flex;
  align-items: center;
  gap: var(--space-2xs);
}

.snapshot-form input {
  flex: 1;
  min-width: 0;
}

.history {
  list-style: none;
  padding: 0;
}

.history-item {
  display: grid;
  grid-template-columns: 12px minmax(0, 1fr);
  gap: var(--space-xs);
  padding: var(--space-sm) 0;
  border-top: 1px solid var(--line);
  position: relative;
}

.history-item:first-child {
  padding-top: var(--space-3xs);
  border-top: 0;
}

.history-dot {
  width: 9px;
  height: 9px;
  margin-top: var(--space-2xs);
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  background: var(--surface);
  z-index: 1;
}

.history-item:not(:first-child)::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--line);
  z-index: 0;
}

.history-item.head .history-dot {
  background: var(--accent);
  border-color: var(--accent);
}

.history-item.head::before {
  background: var(--line);
}

.history-body {
  min-width: 0;
}

.history-body h3 {
  margin-bottom: var(--space-3xs);
  font-family: var(--font-display);
  font-size: var(--text-sm);
  font-weight: 600;
  overflow-wrap: anywhere;
}

.history-body .row {
  gap: var(--space-xs);
}

/* Timestamps and revision ids are data: mono with tabular numerals keeps the
   columns from shifting between rows. */
.history-body .muted {
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  font-variant-numeric: tabular-nums;
}

.drive-panel input {
  font-size: var(--text-xs);
}

.status {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2xs);
  color: var(--ink-2);
  font-size: var(--text-2xs);
  font-weight: 550;
}

.status::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--line-strong);
}

.status.on::before {
  background: var(--accent);
}

/* ---- Settings ------------------------------------------------------- */

.settings-rows {
  display: grid;
  gap: var(--space-xs);
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  flex-wrap: wrap;
  padding-top: var(--space-xs);
  border-top: 1px solid var(--line);
}

.setting-row:first-child {
  padding-top: 0;
  border-top: 0;
}

.setting-row strong {
  font-family: var(--font-display);
  font-size: var(--text-sm);
  font-weight: 600;
}

.setting-row .muted {
  display: block;
  max-width: 60ch;
  font-size: var(--text-2xs);
}

.seg {
  display: flex;
  gap: var(--space-3xs);
  flex-wrap: wrap;
}

.seg button[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--surface-2);
  color: var(--ink);
}

/* ---- Utilities ------------------------------------------------------ */

.muted {
  color: var(--ink-2);
}

.small {
  font-size: var(--text-xs);
}

.tiny {
  font-size: var(--text-2xs);
}

.block {
  display: block;
}

.break {
  overflow-wrap: anywhere;
}

.error {
  color: var(--danger-text);
}

/* ---- Context menu --------------------------------------------------- */

.game-menu {
  position: fixed;
  min-width: 236px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-far);
  padding: var(--space-3xs);
  display: flex;
  flex-direction: column;
  gap: 2px;
  z-index: 100;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: var(--space-2xs);
  width: 100%;
  padding: var(--space-2xs) var(--space-xs);
  border: none;
  background: transparent;
  border-radius: var(--radius-control);
  color: var(--ink);
  font-size: var(--text-sm);
  font-weight: 500;
  text-align: left;
  cursor: pointer;
}

.menu-item:hover:not(:disabled) {
  background: var(--surface-2);
}

.menu-item:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: -2px;
}

.menu-item:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.menu-item.menu-item-danger {
  color: var(--danger-text);
}

.menu-item.menu-item-danger:hover:not(:disabled) {
  background: var(--danger);
  color: var(--danger-ink);
}

.menu-separator {
  border: none;
  border-top: 1px solid var(--line);
  margin: var(--space-3xs) 0;
}

/* ---- Dialogs -------------------------------------------------------- */

dialog.modal {
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--ink);
  max-width: min(560px, calc(100vw - 2 * var(--space-lg)));
}

dialog.modal::backdrop {
  background: var(--scrim);
}

dialog.modal .dialog-card {
  width: 100%;
}

.dialog-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-dialog);
  padding: var(--space-md);
  max-width: 420px;
  width: 90vw;
  box-shadow: var(--shadow-far);
}

.dialog-card h3 {
  margin-bottom: var(--space-2xs);
  font-family: var(--font-display);
  font-size: var(--text-lg);
  font-weight: 600;
  letter-spacing: -0.015em;
}

.dialog-card p {
  margin-bottom: var(--space-2xs);
  color: var(--ink-2);
  font-size: var(--text-sm);
}

/* A dialog's Cancel is a peer action, not a link: give it a real boundary. */
.dialog-card button.ghost {
  border-color: var(--line-strong);
  background: var(--surface);
}

.dialog-card button.danger {
  background: var(--danger);
  border-color: var(--danger);
  color: var(--danger-ink);
}

.dialog-card button.danger:hover:not(:disabled) {
  background: var(--danger);
  border-color: var(--danger);
  color: var(--danger-ink);
  filter: brightness(1.06);
}

/* ---- Theme toggle --------------------------------------------------- */

.theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  padding: 0;
  flex: none;
  border-radius: var(--radius-control);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease),
    border-color var(--dur-fast) var(--ease);
}

.theme-toggle:hover:not(:disabled) {
  background: var(--surface-2);
  border-color: var(--accent);
}

.theme-toggle:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}

.theme-toggle svg {
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  stroke: currentColor;
}

/* ---- Responsive ------------------------------------------------------ */

@media (max-width: 980px) {
  .content {
    padding: var(--space-md) var(--space-md) var(--space-lg);
  }

  .view-header h2,
  .detail-copy h2 {
    font-size: var(--text-xl);
  }
}

@media (max-width: 760px) {
  .app {
    grid-template-rows: auto minmax(0, 1fr);
    height: auto;
    min-height: 100vh;
  }

  .topbar {
    padding: var(--space-2xs) var(--space-sm);
  }

  .nav {
    order: 3;
    width: 100%;
    margin-left: 0;
  }

  .content {
    overflow-y: visible;
    padding: 20px 16px 40px;
  }

  .tile-grid {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: var(--space-sm) var(--space-xs);
  }

  .detail-header {
    grid-template-columns: 120px minmax(0, 1fr);
    gap: 16px;
  }

  .detail-cover,
  .detail-cover .cover-art {
    width: 120px;
  }

  .detail-actions {
    grid-column: 2;
  }

  .snapshot-form {
    flex-wrap: wrap;
  }

  .snapshot-form input {
    flex-basis: 100%;
  }

  .snapshot-form .primary {
    width: 100%;
  }
}

    cloud: '<path d="M7.2 18.5h9.6a3.9 3.9 0 0 0 .5-7.8 5.6 5.6 0 0 0-10.8-1.2 4.5 4.5 0 0 0 .7 9Z"/>',
    settings: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.5 4.5l1.7 1.7M17.8 17.8l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.5 19.5l1.7-1.7M17.8 6.2l1.7-1.7"/>',
  };

  let currentView = "library";
  let selectedGameId = null;
  let detailTab = "overview";
  let menuGameId = null;
  let menuTriggerEl = null;

  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatBytes(bytes) {
    if (bytes === 0 && typeof bytes === "number") return "0 B";
    if (bytes < 1024) return bytes + " B";
    const units = ["KiB", "MiB", "GiB", "TiB"];
    let value = bytes;
    let unit = -1;
    do { value /= 1024; unit += 1; } while (value >= 1024 && unit < units.length - 1);
    return value.toFixed(value >= 10 ? 0 : 1) + " " + units[unit];
  }

  function relativeTime(ms) {
    const sec = Math.max(0, Math.floor((T0 - ms) / 1000));
    if (sec < 60) return sec + " sec ago";
    const min = Math.floor(sec / 60);
    if (min < 60) return min === 1 ? "1 min ago" : min + " min ago";
    const h = Math.floor(min / 60);
    if (h < 24) return h === 1 ? "1 h ago" : h + " h ago";
    const d = Math.floor(h / 24);
    if (d < 30) return d === 1 ? "1 day ago" : d + " days ago";
    return new Date(ms).toLocaleDateString();
  }

  function formatDate(ms) {
    return new Date(ms).toLocaleString(undefined, {
      year: "numeric", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit"
    });
  }

  function shortId(id) { return id.slice(0, 8); }
  function adapterLabel(a) { return ADAPTER_LABELS[a] || a.replace(/_/g, " "); }

  // ---- Cover art generation (mirrors src/lib/cover.ts) ----
  function fnv1a(value) {
    let hash = 0x811c9dc5;
    for (let i = 0; i < value.length; i++) {
      hash ^= value.charCodeAt(i);
      hash = Math.imul(hash, 0x01000193);
    }
    return hash >>> 0;
  }
  function mix32(value) {
    let hash = value;
    hash ^= hash >>> 16;
    hash = Math.imul(hash, 0x85ebca6b);
    hash ^= hash >>> 13;
    hash = Math.imul(hash, 0xc2b2ae35);
    hash ^= hash >>> 16;
    return hash >>> 0;
  }
  const SKIP_WORDS = new Set(["the","a","an","of","and","el","la","los","las","le","les","de","del","der","die","das","und","et","y","in","on","at","to","for","with","into","from"]);
  function monogramFor(title) {
    const folded = title.normalize("NFKD").replace(/[̀-ͯ]/g, "");
    const words = folded.split(/s+/)
      .map(w => w.replace(/[^\p{L}\p{N}]/gu, ""))
      .filter(w => w.length > 0)
      .filter(w => !SKIP_WORDS.has(w.toLowerCase()));
    if (words.length === 0) return "?";
    const first = Array.from(words[0])[0];
    if (words.length === 1) return first.toUpperCase();
    const last = Array.from(words[words.length - 1])[0];
    return (first + last).toUpperCase();
  }
  function coverFor(title) {
    const paletteCount = 8;
    const motifCount = 3;
    const paletteIndex = mix32(fnv1a(title + "#palette")) % paletteCount;
    const motifIndex = mix32(fnv1a(title + "#motif")) % motifCount;
    return { paletteIndex, motifIndex, monogram: monogramFor(title) };
  }
  const MOTIFS = ["rings", "orbit", "slats"];
  const CREST_X = 300, CREST_Y = 436;
  function renderCover(container, title) {
    if (!container) return;
    const spec = coverFor(title);
    const p = spec.paletteIndex;
    container.style.setProperty("--cover-bg", "var(--cover-palette-" + p + "-bg)");
    container.style.setProperty("--cover-bg2", "var(--cover-palette-" + p + "-bg2)");
    container.style.setProperty("--cover-ink", "var(--cover-palette-" + p + "-ink)");
    container.style.setProperty("--cover-accent", "var(--cover-palette-" + p + "-accent)");
    const monoLen = Array.from(spec.monogram).length;
    const glyphSize = monoLen > 1 ? 216 : 268;
    let motifSvg = "";
    if (MOTIFS[spec.motifIndex] === "rings") {
      motifSvg = `<rect x="${CREST_X-232}" y="${CREST_Y-232}" width="464" height="464" rx="128" opacity="0.34"/><rect x="${CREST_X-176}" y="${CREST_Y-176}" width="352" height="352" rx="100" opacity="0.5"/><rect x="${CREST_X-120}" y="${CREST_Y-120}" width="240" height="240" rx="70" opacity="0.7"/>`;
    } else if (MOTIFS[spec.motifIndex] === "orbit") {
      motifSvg = `<circle cx="${CREST_X}" cy="${CREST_Y}" r="222" opacity="0.3"/><circle cx="${CREST_X}" cy="${CREST_Y}" r="166" opacity="0.46"/><circle cx="${CREST_X}" cy="${CREST_Y}" r="110" opacity="0.68"/>`;
    } else {
      motifSvg = `<g transform="rotate(-18 ${CREST_X} ${CREST_Y})" stroke-linecap="round"><line x1="${CREST_X-190}" y1="${CREST_Y-96}" x2="${CREST_X+190}" y2="${CREST_Y-96}" opacity="0.3" stroke-width="30"/><line x1="${CREST_X-214}" y1="${CREST_Y}" x2="${CREST_X+214}" y2="${CREST_Y}" opacity="0.46" stroke-width="30"/><line x1="${CREST_X-190}" y1="${CREST_Y+96}" x2="${CREST_X+190}" y2="${CREST_Y+96}" opacity="0.68" stroke-width="30"/></g>`;
    }
    container.innerHTML = `<svg viewBox="0 0 600 900" preserveAspectRatio="xMidYMid slice" focusable="false" aria-hidden="true"><rect width="600" height="900" fill="var(--cover-bg)"/><rect x="-170" y="-210" width="580" height="560" rx="150" fill="var(--cover-bg2)"/><rect x="330" y="600" width="380" height="380" rx="140" fill="var(--cover-bg2)" opacity="0.55"/><g fill="none" stroke="var(--cover-accent)" stroke-width="2.5">${motifSvg}</g><text x="${CREST_X}" y="${CREST_Y}" text-anchor="middle" dominant-baseline="central" fill="var(--cover-ink)" font-family='"Fredoka", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif' font-size="${glyphSize}" font-weight="600" letter-spacing="-8">${escapeHtml(spec.monogram)}</text><rect x="28" y="28" width="544" height="844" rx="26" fill="none" stroke="var(--cover-ink)" stroke-opacity="0.14" stroke-width="1.5"/></svg>`;
  }

  function renderHistory(game) {

  function renderConflictsTab(game) {
    const gameConflicts = CONFLICTS.filter(c => c.gameId === game.id);

  function renderCloud() {

c-backups" disabled></label><label>Access key<input type="text" placeholder="AKIA..." disabled></label></div></section><section class="provider-card"><div class="provider-header"><h3>Dropbox</h3><span class="tag planned">Planned — not yet implemented</span></div><p class="muted small">Sign in with Dropbox and choose a SaveSync folder inside your account.</p><div class="row"><label style="flex:1;min-width:240px;">Account<input type="text" placeholder="aiden@example.com" disabled></label></div><button class="primary" type="button" disabled>Connect Dropbox</button></section><section class="local-first-panel" aria-labelledby="local-title"><h3 id="local-title">Local-first guarantee</h3><p class="muted small">Backups and restores run against the local blob store and SQLite database. Remote providers are additive: when a provider is unavailable, the local timeline stays readable and restorable.</p></section></div></section>`;

button></div></form></section><section class="panel" aria-labelledby="data-title"><div class="panel-title"><h2 id="data-title">Data location</h2></div><p class="muted small">The local database, blob store, and safety backups live in the SaveSync application data directory. Move or back up this folder to migrate the entire library.</p><div class="row"><code class="field-value" style="flex:1;">C:\\Users\\aiden\\AppData\\Roaming\\com.savesync.dev</code><button class="ghost" type="button" disabled>Open folder</button></div></section></div></section>`;

  function bindDetailActions(rootEl, game) {
    rootEl.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;
        if (action === "snapshot") showNotice("Backup now is a preview in this mockup.");
        else if (action === "restore" || action === "restore-rev") showNotice("Restore preview: a safety backup would be created first.");
        else if (action === "exact-rev") showNotice("Exact restore preview: unrelated live files would be removed.");
        else if (action === "sync") showNotice("Sync preview: revisions would be exchanged with Google Drive.");
        else if (action === "cover") showNotice("Fetch cover art preview: SteamGridDB lookup.");
        else if (action === "resolve") showNotice("Conflict resolution preview: both revisions are preserved.");
        else if (action === "disconnect-drive") showNotice("Disconnect preview: local data remains.");
        else if (action === "sync-drive") showNotice("Sync all games preview.");
      });
    });
    rootEl.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        detailTab = tab.dataset.tab;
        render();
      });
    });
    rootEl.addEventListener("keydown", e => {
      if (e.target.classList.contains("tab")) {
        const tabs = Array.from(rootEl.querySelectorAll(".tab"));
        const idx = tabs.indexOf(e.target);
        let moved = false;
        if (e.key === "ArrowRight") { e.preventDefault(); detailTab = tabs[(idx + 1) % tabs.length].dataset.tab; moved = true; }
        else if (e.key === "ArrowLeft") { e.preventDefault(); detailTab = tabs[(idx - 1 + tabs.length) % tabs.length].dataset.tab; moved = true; }
        else if (e.key === "Home") { e.preventDefault(); detailTab = tabs[0].dataset.tab; moved = true; }
        else if (e.key === "End") { e.preventDefault(); detailTab = tabs[tabs.length - 1].dataset.tab; moved = true; }
        if (moved) {
          render();
          // Re-rendering replaced the DOM; keep focus on the roving tab.
          const selected = rootEl.querySelector(".tab[aria-selected=\"true\"]");
          if (selected) selected.focus();
        }
      }
    });
    $("back-btn")?.addEventListener("click", () => { selectedGameId = null; render(); });
  }

  function render() {
    const root = $("view-root");
    if (currentView === "library" && selectedGameId) {
      const game = gameById(selectedGameId);
      root.innerHTML = renderDetail(game);
      // Populate the active tab panel BEFORE looking up #detail-cover: the
      // cover element only exists on the Overview tab panel.
      const panel = $("tabpanels");
      if (panel) {
        if (detailTab === "overview") panel.innerHTML = `<section class="tabpanel" id="tabpanel-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0">${renderOverview(game)}</section>`;
        else if (detailTab === "history") panel.innerHTML = `<section class="tabpanel" id="tabpanel-history" role="tabpanel" aria-labelledby="tab-history" tabindex="0">${renderHistory(game)}</section>`;
        else if (detailTab === "conflicts") panel.innerHTML = `<section class="tabpanel" id="tabpanel-conflicts" role="tabpanel" aria-labelledby="tab-conflicts" tabindex="0">${renderConflictsTab(game)}</section>`;
        else panel.innerHTML = `<section class="tabpanel" id="tabpanel-activity" role="tabpanel" aria-labelledby="tab-activity" tabindex="0">${renderActivity()}</section>`;
      }
      const coverEl = $("detail-cover");
      if (coverEl) renderCover(coverEl, game.title);
      bindDetailActions(root, game);
      return;
    }
    if (currentView === "library") {
      root.innerHTML = renderLibrary();
      GAMES.forEach(g => renderCover($("cover-" + g.id), g.title));
      root.querySelectorAll(".tile[data-game-id]").forEach(tile => {
        tile.addEventListener("click", () => { selectedGameId = tile.dataset.gameId; detailTab = "overview"; render(); });
        tile.addEventListener("contextmenu", e => openMenu(e, tile.dataset.gameId, tile));
        tile.addEventListener("keydown", e => openMenuFromKeyboard(e, tile.dataset.gameId, tile));
      });
      $("enroll-tile")?.addEventListener("click", () => showNotice("Enroll preview: opens the enrollment dialog."));
      $("enroll-btn")?.addEventListener("click", () => showNotice("Enroll preview: opens the enrollment dialog."));
      return;
    }
    if (currentView === "snapshots") root.innerHTML = renderSnapshots();
    else if (currentView === "conflicts") root.innerHTML = renderConflictsView();
    else if (currentView === "cloud") root.innerHTML = renderCloud();
    else if (currentView === "settings") {
      root.innerHTML = renderSettings();
      bindSettings(root);
    }
    // Bind cloud action buttons in cloud view.
    root.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;
        if (action === "disconnect-drive") showNotice("Disconnect preview: local data remains.");
        else if (action === "sync-drive") showNotice("Sync all games preview.");
      });
    });
  }

  function bindSettings(rootEl) {
    rootEl.querySelectorAll(".theme-seg").forEach(btn => {
      btn.addEventListener("click", () => setTheme(btn.dataset.themeSet));
    });
    const form = $("steamgrid-form");
    if (form) form.addEventListener("submit", e => { e.preventDefault(); showNotice("SteamGridDB key saved preview."); });
  }

  // ---- Context menu ----
  function openMenu(e, gameId, triggerEl) {
    e.preventDefault();
    menuGameId = gameId;
    menuTriggerEl = triggerEl || null;
    const menu = $("game-menu");
    const game = gameById(gameId);
    const hasHead = !!game.head;
    menu.innerHTML = `<button type="button" class="menu-item" role="menuitem" data-menu="details">Open details</button><button type="button" class="menu-item" role="menuitem" data-menu="backup">Backup now</button><button type="button" class="menu-item" role="menuitem" data-menu="restore" ${!hasHead ? "disabled" : ""}>Restore latest…</button><button type="button" class="menu-item" role="menuitem" data-menu="sync">Sync now</button><button type="button" class="menu-item" role="menuitem" data-menu="cover">Fetch cover art</button><hr class="menu-separator"><button type="button" class="menu-item menu-item-danger" role="menuitem" data-menu="remove">Remove from library…</button>`;
    menu.hidden = false;
    const rect = menu.getBoundingClientRect();
    let x = e.clientX, y = e.clientY;
    const topbar = document.querySelector(".topbar");
    const topInset = topbar ? topbar.getBoundingClientRect().bottom + 8 : 56;
    if (x + rect.width > window.innerWidth) x = window.innerWidth - rect.width - 8;
    if (y + rect.height > window.innerHeight) y = window.innerHeight - rect.height - 8;
    if (y < topInset) y = topInset;
    menu.style.left = x + "px";
    menu.style.top = y + "px";
    const items = Array.from(menu.querySelectorAll("[role='menuitem']"));
    const firstEnabled = items.findIndex(el => !el.disabled);
    if (firstEnabled >= 0) items[firstEnabled].focus();
    menu.addEventListener("keydown", handleMenuKeyDown);
  }

  function openMenuFromKeyboard(e, gameId, trigger) {
    if (e.key !== "ContextMenu" && !(e.shiftKey && e.key === "F10")) return;
    e.preventDefault();
    const rect = trigger.getBoundingClientRect();
    const fake = { clientX: rect.left + Math.min(rect.width, 48), clientY: rect.top + 32, preventDefault: function(){} };
    openMenu(fake, gameId, trigger);
  }

  function closeMenu() {
    const menu = $("game-menu");
    menu.hidden = true;
    menu.innerHTML = "";
    menuGameId = null;
    // Return focus to the tile that opened the menu so keyboard flow continues.
    if (menuTriggerEl && menuTriggerEl.isConnected) menuTriggerEl.focus();
    menuTriggerEl = null;
  }

  function handleMenuKeyDown(e) {
    const menu = $("game-menu");
    const items = Array.from(menu.querySelectorAll("[role='menuitem']"));
    const idx = items.indexOf(document.activeElement);
    function next(start, dir) {
      let i = start;
      for (let s = 0; s < items.length; s++) {
        i = (i + dir + items.length) % items.length;
        if (!items[i].disabled) return i;
      }
      return start;
    }
    if (e.key === "Tab") { e.preventDefault(); closeMenu(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); items[next(idx, 1)].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); items[next(idx, -1)].focus(); }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); document.activeElement.click(); }
  }

  $("game-menu").addEventListener("click", e => {
    const item = e.target.closest("[data-menu]");
    if (!item) return;
    const action = item.dataset.menu;
    const game = gameById(menuGameId);
    closeMenu();
    if (action === "details") { selectedGameId = menuGameId; detailTab = "overview"; render(); }
    else if (action === "backup") showNotice("Backup now preview.");
    else if (action === "restore") showNotice("Restore latest preview.");
    else if (action === "sync") showNotice("Sync now preview.");
    else if (action === "cover") showNotice("Fetch cover art preview.");
    else if (action === "remove") openUnlinkDialog();
  });
  document.addEventListener("mousedown", e => {
    const menu = $("game-menu");
    if (!menu.hidden && !menu.contains(e.target)) closeMenu();
  });
  // Escape must close the open menu regardless of where keyboard focus is.
  document.addEventListener("keydown", e => {
    const menu = $("game-menu");
    if (e.key !== "Escape" || menu.hidden) return;
    const dlg = $("unlink-dialog");
    if (dlg.open) return; // dialog owns Escape while it is open
    e.preventDefault();
    closeMenu();
  });

  // ---- Unlink dialog ----
  function openUnlinkDialog() {
    const dlg = $("unlink-dialog");
    dlg.showModal();
    $("unlink-cancel").focus();
  }
  $("unlink-cancel").addEventListener("click", () => $("unlink-dialog").close());
  $("unlink-confirm").addEventListener("click", () => { $("unlink-dialog").close(); showNotice("Remove preview: game unlinked, revisions preserved."); });
  $("unlink-dialog").addEventListener("click", e => { if (e.target === $("unlink-dialog")) $("unlink-dialog").close(); });
  $("unlink-dialog").addEventListener("cancel", e => { e.preventDefault(); $("unlink-dialog").close(); });

  // ---- Notice ----
  function showNotice(text) {
    $("notice-text").textContent = text;
    $("notice").hidden = false;
    window.clearTimeout(showNotice.timer);
    showNotice.timer = window.setTimeout(() => { $("notice").hidden = true; }, 4000);
  }
  $("notice-dismiss").addEventListener("click", () => $("notice").hidden = true);

  // ---- Theme ----
  function setTheme(next) {
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("savesync-mockup-theme", next); } catch (e) {}
    updateThemeToggle();
    // Keep the Settings segmented control in sync when it is on screen.
    document.querySelectorAll(".theme-seg").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.themeSet === next));
    });
  }
  function updateThemeToggle() {
    const isDark = document.documentElement.dataset.theme === "dark";
    const btn = $("theme-toggle");
    btn.setAttribute("aria-pressed", String(isDark));
    btn.setAttribute("aria-label", isDark ? "Switch to light theme" : "Switch to dark theme");
    btn.innerHTML = isDark
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  }
  $("theme-toggle").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

  renderNav();
  updateThemeToggle();
  render();
})();
</script>
</body>
</html>
